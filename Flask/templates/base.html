<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}Employee Productivity{% endblock %}</title>

    <meta
      name="description"
      content="Employee productivity prediction powered by machine learning."
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />

    {% block page_css %}{% endblock %}
  </head>

  <body>
    <header class="site-header">
      <nav class="navbar">
        <a href="/" class="brand">
          <span class="brand-mark">EP</span>
          <span class="brand-name">Employee Productivity</span>
        </a>

        <div class="nav-links">
          <a href="/" class="nav-link">Home</a>
          <a href="/about" class="nav-link">About</a>
          <a href="/predict" class="nav-link nav-cta">Predict</a>
        </div>
      </nav>
    </header>

    <main class="site-main">{% block content %}{% endblock %}</main>
  </body>
</html>
